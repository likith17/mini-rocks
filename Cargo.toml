[package]
name = "minirocks"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A small, durable LSM-tree key-value store written from scratch"
publish = false

[dependencies]
# CRC32 for per-record checksums in the WAL (and later SSTable blocks).
# Justification: hardware-accelerated (SSE4.2/PCLMULQDQ, ARMv8 CRC) and tiny;
# its only transitive dependency is `cfg-if`. A hand-rolled table CRC would
# work, but checksumming sits on the hot write path, so speed matters.
crc32fast = "1.4"

[features]
# Named crash points for the crash-consistency harness (src/crashpoint.rs).
# Off by default; compiled to nothing without it.
failpoints = []

[[bin]]
name = "crashtest"
path = "src/bin/crashtest.rs"
required-features = ["failpoints"]

# Benchmarks live in their own crate so baseline engines never become
# dependencies of the library.
[workspace]
members = ["bench"]

[profile.release]
debug = 1 # line tables, for profiling benchmark runs; no effect on speed
