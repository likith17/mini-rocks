[package]
name = "minirocks-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmarks comparing MiniRocks with an established engine"

[dependencies]
minirocks = { path = ".." }
# Baseline only, never a dependency of MiniRocks itself. sled is a pure-Rust
# embedded KV store. RocksDB (rust-rocksdb) was the first choice, but it
# needs libclang and a C++ toolchain, which this machine doesn't have (see
# DECISIONS.md §11).
sled = "0.34.7"
